name: AcerLab link check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trailing-slash rooms are directory indexes only
        run: |
          set -euo pipefail
          test -f onboarding/index.html
          test ! -f onboarding.html
          test -f plan/index.html
          test ! -f plan.html
          test -f plan/legacy/index.html
          test ! -f plan/legacy.html
          test -f tools/index.html
          test ! -f tools.html
          test -f plan-legacy.html
          grep -q '/onboarding/' app.js
          grep -q '/plan/' app.js
          grep -q '/plan/legacy/' app.js
          grep -q '/tools/' app.js
          echo "trailing-slash rooms ok"
