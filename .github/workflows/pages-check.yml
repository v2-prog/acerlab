name: AcerLab link check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Onboarding is a single file, not a redirect loop
        run: |
          set -euo pipefail
          test -f onboarding.html
          test ! -d onboarding
          grep -q "Review status: draft" onboarding.html
          echo "onboarding file ok"
