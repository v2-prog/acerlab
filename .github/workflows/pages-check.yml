name: AcerLab link check
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rooms are single files, and /plan/legacy redirects
        run: |
          set -euo pipefail
          test -f onboarding.html
          test ! -d onboarding
          test -f plan.html
          test ! -d plan
          test -f plan-legacy.html
          test ! -f plan/legacy.html
          grep -q '/plan/legacy /plan-legacy 301' _redirects
          grep -q '/plan/legacy/ /plan-legacy 301' _redirects
          grep -q 'Review status: draft' plan-legacy.html
          echo "legacy route ok"
